name: Testes-ci

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  testes-unitarios:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install -r requirements-dev.txt
      - run: pytest -v
      - run: ruff check .
    
  imagem:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - run: docker build -t biblioteca-ci:latest .
      - run: docker run -d -name biblioteca-ci -p 8000:8000 biblioteca-ci:latest
      - run: sleep 10
      - run: curl -fsS http://localhost:8000/saude

